source: boundary.md
section1:
  entries:
    - type: Single file
      path: electron/fileManager.ts
      purpose: 文件读写/行级编辑/搜索/备份恢复、Shell 执行与任务日志（Provider）
    - type: Single file
      path: electron/server/services/db.ts
      purpose: SQLite 持久化：features、changes、meta（Provider）
    - type: Single file
      path: electron/server/types.ts
      purpose: 服务端共享请求/响应类型（FeatureNode、AgentRequest 等，Model）
    - type: Single file
      path: frontend/src/components/CodeViewer.tsx
      purpose: 代码查看器：文件内容展示、行选择与滚动定位
    - type: Single file
      path: frontend/test/db.test.ts
      purpose: services/db.ts 的单元测试（既有）
    - type: Single file
      path: frontend/test/fileManager.test.ts
      purpose: fileManager.ts 的单元测试（既有）
    - type: Owned directory
      path: frontend/test/project-data/
      purpose: 本角色新增单元与层内契约测试的归属目录；不放置生产代码
    - type: Single file
      path: 角色卡/project-data/memo.md
      purpose: 本角色的简短事实与续接线索
    - type: Single file
      path: 角色卡/project-data/feature-map.md
      purpose: 功能导航：用途、状态与文档链接
    - type: Single file
      path: 角色卡/project-data/changelog.md
      purpose: 本角色的创建与范围变更历史
    - type: Single file
      path: 角色卡/project-data/functional-description.md
      purpose: 模块说明与代码位置
    - type: Single file
      path: 角色卡/project-data/api-spec.md
      purpose: 实际导出（fileManager/db 对外函数与表结构）、依赖与测试证据
    - type: Conditional directory
      path: 角色卡/project-data/docs/
      purpose: 本角色的设计/功能/变更/修复历史文档
  notes:
    - 本文件仅包含 Section 1：本角色的可修改文件与目录白名单，是本角色唯一的变更授权来源。同名 boundary.yaml 只是同步副本，不构成第二授权源。
    - 未在本 Section 1 中列出、也不被已接受目录覆盖的文件默认只读。要修改未覆盖的文件，必须先提交 Section 1 更新提案，并经过与代码变更相同的证据与验收门。
    - 在已接受的目录范围内新增或删除普通文件不需要重写 Section 1；新增目录授权、改变归属，或增删单独列出的路径，必须由治理角色（ANS Governance）先更新 Section 1。
    - 本角色的只读依赖（引用其公开能力，不修改其文件）：frontend/src/i18n/**（项目管理）。fileManager.ts 与 db.ts 的导出函数/表结构是本角色主属主的基础设施契约，被 agent-pipeline（工具执行）与应用外壳（IPC、closeDatabase、健康检查）引用；变更契约会使其下游证据失效，必须先出设计并通知受影响角色。
