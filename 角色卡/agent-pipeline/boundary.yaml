source: boundary.md
section1:
  entries:
    - type: Single file
      path: electron/server/routes/agent.ts
      purpose: Agent 对话/分类/命名/计划/动作的 HTTP 与 SSE 接口（Interface）
    - type: Single file
      path: electron/server/services/agent.ts
      purpose: 多 Agent 编排与转换核心：流式对话、计划流、子代理、动作执行、工具调用（Pipeline/Service）
    - type: Single file
      path: frontend/src/App.tsx
      purpose: 前端组合根：阶段状态机、图谱数据下发、面板组合（自动执行编排见 hooks/useAutoExec.ts）
    - type: Single file
      path: frontend/src/hooks/useAutoExec.ts
      purpose: App 自动执行编排 hook（批 2/D3 抽取：拓扑排序、依赖检查、逐节点执行与记录持久化；含可测纯函数）
    - type: Single file
      path: frontend/src/components/ChatPanel.tsx
      purpose: 对话面板：Agent 时间线、流式接收与计划/审查卡片挂载
    - type: Single file
      path: frontend/src/components/PlanCard.tsx
      purpose: 计划卡片展示
    - type: Single file
      path: frontend/src/components/ReviewCard.tsx
      purpose: 审查卡片展示
    - type: Single file
      path: frontend/src/components/ActionDialog.tsx
      purpose: 操作类型对话框（修复/测试/重构/解释/开发）
    - type: Single file
      path: frontend/src/components/ActionPanel.tsx
      purpose: 操作执行面板：动作/审查/修复/重绘流式时间线
    - type: Single file
      path: frontend/test/agent.test.ts
      purpose: services/agent.ts 的单元测试（既有）
    - type: Owned directory
      path: frontend/test/agent-pipeline/
      purpose: 本角色单元与层内契约测试的归属目录；不放置生产代码
    - type: Single file
      path: 角色卡/agent-pipeline/memo.md
      purpose: 本角色的简短事实与续接线索
    - type: Single file
      path: 角色卡/agent-pipeline/feature-map.md
      purpose: 功能导航：用途、状态与文档链接
    - type: Single file
      path: 角色卡/agent-pipeline/changelog.md
      purpose: 本角色的创建与范围变更历史
    - type: Single file
      path: 角色卡/agent-pipeline/functional-description.md
      purpose: 模块说明与代码位置
    - type: Single file
      path: 角色卡/agent-pipeline/api-spec.md
      purpose: 实际导出、依赖、装配说明与测试证据
    - type: Conditional directory
      path: 角色卡/agent-pipeline/docs/
      purpose: 本角色的设计/功能/变更/修复历史文档
  notes:
    - 本文件仅包含 Section 1：本角色的可修改文件与目录白名单，是本角色唯一的变更授权来源。同名 boundary.yaml 只是同步副本，不构成第二授权源。
    - 未在本 Section 1 中列出、也不被已接受目录覆盖的文件默认只读。要修改未覆盖的文件，必须先提交 Section 1 更新提案，并经过与代码变更相同的证据与验收门。
    - 在已接受的目录范围内新增或删除普通文件不需要重写 Section 1；新增目录授权、改变归属，或增删单独列出的路径，必须由治理角色（ANS Governance）先更新 Section 1。
    - 本角色的只读依赖（引用其公开能力，不修改其文件）：electron/fileManager.ts、electron/server/services/db.ts（项目数据）、frontend/src/i18n/**（项目管理）、frontend/src/types/graph.ts 的图谱共享类型（图谱视图；MapCanvas 重导出兼容）、frontend/src/components/RightPanel.tsx / SettingsPanel.tsx / TitleBar.tsx / ResizeHandle.tsx（应用外壳）。需要它们变化时向项目管理角色提出请求。
