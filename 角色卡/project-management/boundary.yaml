source: boundary.md
section1:
  entries:
    - type: Single file
      path: frontend/src/i18n/index.tsx
      purpose: 跨角色共享国际化机制：Locale Context、useT、locale 检测与持久化
    - type: Single file
      path: frontend/src/i18n/zh-CN.json
      purpose: 中文字符串资源
    - type: Single file
      path: frontend/src/i18n/en.json
      purpose: 英文字符串资源
    - type: Single file
      path: frontend/src/i18n/ja.json
      purpose: 日文字符串资源
    - type: Single file
      path: frontend/src/i18n/ko.json
      purpose: 韩文字符串资源
    - type: Single file
      path: README.md
      purpose: 项目说明与使用示意（随产品形态同步维护）
    - type: Owned directory
      path: docs/images/
      purpose: README 配图资产（应用截图等），随文档同步维护
    - type: Owned directory
      path: frontend/test/project-management/
      purpose: 共享基础代码（i18n）的单元与契约测试；不放置生产代码
    - type: Single file
      path: 角色卡/project-management/memo.md
      purpose: 本角色的简短事实与续接线索
    - type: Single file
      path: 角色卡/project-management/feature-map.md
      purpose: 功能导航：用途、状态与文档链接
    - type: Single file
      path: 角色卡/project-management/changelog.md
      purpose: 本角色的创建与范围变更历史
    - type: Single file
      path: 角色卡/project-management/functional-description.md
      purpose: 模块说明与代码位置
    - type: Single file
      path: 角色卡/project-management/api-spec.md
      purpose: 共享基础代码的实际导出、依赖与测试证据
    - type: Single file
      path: 角色卡/project-management/docs/architecture.md
      purpose: 项目整体架构（当前态，含 Mermaid 角色协作图）
    - type: Single file
      path: 角色卡/project-management/docs/architecture/shared-components.md
      purpose: 共享组件清单（i18n 等）及其消费者
    - type: Single file
      path: 角色卡/project-management/docs/project-rules.md
      purpose: 项目级工程规则
    - type: Conditional directory
      path: 角色卡/project-management/docs/scheduling/
      purpose: docs/scheduling/<task-id>.md：任务计划、步骤表与事件历史；task_ops 是唯一写入者
    - type: Conditional directory
      path: 角色卡/project-management/docs/meetings/
      purpose: 项目级与跨组会议纪要
    - type: Conditional directory
      path: 角色卡/project-management/docs/
      purpose: 本角色的设计/功能/变更/修复历史文档
  notes:
    - 本文件仅包含 Section 1：项目管理角色的可修改文件与目录白名单，是本角色唯一的变更授权来源。同名 boundary.yaml 只是同步副本，不构成第二授权源。
    - 未在本 Section 1 中列出、也不被已接受目录覆盖的文件默认只读。要修改未覆盖的文件，必须先提交 Section 1 更新提案，并经过与代码变更相同的证据与验收门。
    - 在已接受的目录范围内新增或删除普通文件不需要重写 Section 1；新增目录授权、改变归属，或增删单独列出的路径，必须由治理角色（ANS Governance）先更新 Section 1。
    - 本角色不得修改其他角色的业务代码与私有目录、构建配置或权限配置，也不得编辑角色卡与边界文档（治理角色所有）；跨角色修改由本角色安排给对应归属角色执行。
